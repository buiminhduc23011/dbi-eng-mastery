<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dbi-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f7f7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141e1a" media="(prefers-color-scheme: dark)" />
    <title>Đăng nhập · EngMastery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f2;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --field: #f8fafc;
        --accent: #2563eb;
        --accent-strong: #1d4ed8;
        --accent-soft: rgba(37, 99, 235, 0.12);
        --danger: #dc2626;
        --danger-soft: rgba(220, 38, 38, 0.08);
        --ring: rgba(37, 99, 235, 0.35);
        --shadow: 0 24px 60px -24px rgba(15, 23, 42, 0.28);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f19;
          --card: #111827;
          --text: #e2e8f0;
          --muted: #94a3b8;
          --border: #1e293b;
          --field: #0f172a;
          --accent: #3b82f6;
          --accent-strong: #60a5fa;
          --accent-soft: rgba(59, 130, 246, 0.16);
          --danger: #f87171;
          --danger-soft: rgba(248, 113, 113, 0.12);
          --ring: rgba(96, 165, 250, 0.4);
          --shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.8);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(1200px 600px at 50% -10%, var(--accent-soft), transparent 70%),
          var(--bg);
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 380px;
        padding: 36px 32px 28px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: var(--shadow);
        animation: rise 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }

      .brand img {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--field);
        padding: 6px;
      }

      .brand-name {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      .brand-tag {
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        line-height: 1.25;
        letter-spacing: -0.02em;
        font-weight: 800;
      }

      .subtitle {
        margin: 0 0 24px;
        font-size: 13.5px;
        line-height: 1.55;
        color: var(--muted);
      }

      label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 8px;
        letter-spacing: 0.01em;
      }

      .field {
        position: relative;
      }

      input[type="password"],
      input[type="text"] {
        width: 100%;
        height: 46px;
        padding: 0 44px 0 14px;
        background: var(--field);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        font: inherit;
        font-size: 15px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input::placeholder {
        color: var(--muted);
        opacity: 0.7;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--ring);
      }

      .toggle {
        position: absolute;
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .toggle:hover {
        background: var(--accent-soft);
        color: var(--accent-strong);
      }

      .toggle:focus-visible {
        outline: 2px solid var(--ring);
      }

      .error {
        display: none;
        align-items: flex-start;
        gap: 8px;
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--danger-soft);
        border: 1px solid color-mix(in srgb, var(--danger) 28%, transparent);
        color: var(--danger);
        font-size: 13px;
        line-height: 1.45;
      }

      .error.show {
        display: flex;
      }

      button.submit {
        width: 100%;
        height: 46px;
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(180deg, var(--accent), var(--accent-strong));
        color: #fff;
        font: inherit;
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: transform 0.12s ease, filter 0.15s ease, opacity 0.15s ease;
      }

      button.submit:hover {
        filter: brightness(1.06);
      }

      button.submit:active {
        transform: translateY(1px);
      }

      button.submit:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px var(--ring);
      }

      button.submit[disabled] {
        opacity: 0.65;
        cursor: progress;
      }

      .spinner {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        display: none;
      }

      button.submit.loading .spinner {
        display: block;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hint {
        margin: 20px 0 0;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        line-height: 1.55;
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <img src="/dbi-logo.svg" alt="" width="40" height="40" />
        <div>
          <div class="brand-name">EngMastery</div>
          <div class="brand-tag">English SRS Lab</div>
        </div>
      </div>

      <h1>Nhập mật khẩu để vào</h1>
      <p class="subtitle">Trang này chỉ dành cho chủ tài khoản. Mật khẩu được hỏi lại sau mỗi 7 ngày.</p>

      <form id="login-form" novalidate>
        <label for="password">Mật khẩu truy cập</label>
        <div class="field">
          <input
            id="password"
            name="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            spellcheck="false"
            required
            autofocus
          />
          <button type="button" class="toggle" id="toggle" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
            <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg id="eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>

        <div class="error" id="error" role="alert"></div>

        <button type="submit" class="submit" id="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span id="submit-label">Mở khoá</span>
        </button>
      </form>

      <p class="hint">Thiết bị này được ghi nhớ trong 7 ngày.<br />Muốn đăng xuất sớm, vào Cài đặt → Đăng xuất.</p>
    </main>

    <script>
      (function () {
        var form = document.getElementById('login-form');
        var input = document.getElementById('password');
        var button = document.getElementById('submit');
        var label = document.getElementById('submit-label');
        var errorBox = document.getElementById('error');
        var toggle = document.getElementById('toggle');
        var eyeOpen = document.getElementById('eye-open');
        var eyeOff = document.getElementById('eye-off');

        var params = new URLSearchParams(window.location.search);
        var rawNext = params.get('next');
        // Only allow same-origin absolute paths, never protocol-relative URLs.
        var next = rawNext && rawNext.charAt(0) === '/' && rawNext.charAt(1) !== '/' ? rawNext : '/';

        toggle.addEventListener('click', function () {
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          eyeOpen.style.display = show ? 'none' : 'block';
          eyeOff.style.display = show ? 'block' : 'none';
          toggle.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
          input.focus();
        });

        function showError(message) {
          errorBox.textContent = message;
          errorBox.classList.add('show');
        }

        function setLoading(loading) {
          button.disabled = loading;
          button.classList.toggle('loading', loading);
          label.textContent = loading ? 'Đang kiểm tra…' : 'Mở khoá';
        }

        form.addEventListener('submit', async function (event) {
          event.preventDefault();
          errorBox.classList.remove('show');

          if (!input.value) {
            showError('Vui lòng nhập mật khẩu.');
            input.focus();
            return;
          }

          setLoading(true);
          try {
            var response = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: input.value }),
            });

            if (response.ok) {
              label.textContent = 'Đã mở khoá';
              window.location.replace(next);
              return;
            }

            var payload = null;
            try {
              payload = await response.json();
            } catch (ignored) {}

            if (response.status === 429) {
              var seconds = Number(response.headers.get('Retry-After') || 0);
              var minutes = seconds > 0 ? Math.ceil(seconds / 60) : 15;
              showError(payload && payload.error ? payload.error : 'Sai quá nhiều lần. Thử lại sau ' + minutes + ' phút.');
            } else if (response.status === 503) {
              showError('Máy chủ chưa cấu hình mật khẩu truy cập.');
            } else {
              showError(payload && payload.error ? payload.error : 'Mật khẩu không đúng.');
            }
            input.select();
          } catch (error) {
            showError('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.');
          } finally {
            setLoading(false);
          }
        });
      })();
    </script>
  </body>
</html>
